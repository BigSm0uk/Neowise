<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form method="post" action="/api/triage">
    <label for="message">Текст заявки</label>
    <textarea id="message" name="text" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const topics = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch(form.action, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const { status, topic, draft } = await reply.json();
        if (status === "ready") {
          result.textContent = `Тема: ${topics[topic]}\n\nЧерновик ответа:\n${draft}`;
        } else if (status === "manual_review") {
          result.textContent = "Черновик недоступен. Разберите заявку вручную.";
        } else if (status === "invalid_input") {
          result.textContent = "Введите текст заявки.";
          message.focus();
        } else {
          throw new Error("Unexpected triage response");
        }
      } catch {
        result.textContent = "Не удалось обработать заявку. Попробуйте ещё раз.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
